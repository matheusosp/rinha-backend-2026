worker_processes 1;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 100000;

    upstream api {
        least_conn;
        server api1:9999 max_fails=0;
        server api2:9999 max_fails=0;
        keepalive 128;
        keepalive_requests 100000;
    }

    server {
        server_tokens off;
        listen 9999 default_server backlog=8192 reuseport;
        server_name _;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
        }
    }
}

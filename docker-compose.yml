services:
  api1:
    image: ghcr.io/matheusosp/rinha-backend-2026:latest
    environment:
      WEB_CONCURRENCY: 0
      PUMA_THREADS: 2
      RUBY_YJIT_ENABLE: 1
      DATA_DIR: /app/data
      MALLOC_ARENA_MAX: "2"
      RUBY_GC_HEAP_FREE_SLOTS: 500000
      RUBY_GC_HEAP_INIT_SLOTS: 500000
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9999/ready || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"

  api2:
    image: ghcr.io/matheusosp/rinha-backend-2026:latest
    environment:
      WEB_CONCURRENCY: 0
      PUMA_THREADS: 2
      RUBY_YJIT_ENABLE: 1
      DATA_DIR: /app/data
      MALLOC_ARENA_MAX: "2"
      RUBY_GC_HEAP_FREE_SLOTS: 500000
      RUBY_GC_HEAP_INIT_SLOTS: 500000
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9999/ready || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    ports:
      - "9999:9999"
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "50MB"

networks:
  app:
    driver: bridge

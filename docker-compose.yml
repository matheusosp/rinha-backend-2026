services:
  api1: &api
    image: ghcr.io/matheusosp/rinha-backend-2026:latest
    environment:
      WEB_CONCURRENCY: 0
      PUMA_THREADS: 4
      RUBY_YJIT_ENABLE: 1
      DATA_DIR: /app/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9999/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "150MB"

  api2:
    <<: *api

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    ports:
      - "9999:9999"
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "50MB"

networks:
  app:
    driver: bridge
